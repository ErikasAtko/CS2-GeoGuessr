# Fails a pull request when code doesn't follow the team style (see CONTRIBUTING.md).
# Fix locally with `dotnet format` (repo root) and `npm run format` (frontend/).
name: Code style

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (dotnet format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Check formatting
        run: dotnet format CS2-GEO.sln --verify-no-changes --verbosity diagnostic

  frontend:
    name: Frontend (Prettier + oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
